name: CI

'on':
  push:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      COMPOSE_PROJECT_NAME: ailv-tests-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend tests
        run: >-
          docker compose -f compose.test.yml run --build --rm tests
          -q -rs
          --junitxml=reports/junit.xml
          --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Write test summary
        if: always()
        run: python3 ../.github/scripts/test_summary.py "Backend" reports/junit.xml reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          if-no-files-found: warn

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE: http://ailv-test.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: >-
          npm test -- --run --coverage
          --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      - name: Write test summary
        if: always()
        run: python3 ../.github/scripts/test_summary.py "Frontend" reports/junit.xml coverage/cobertura-coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/reports/
            frontend/coverage/
          if-no-files-found: warn

      - name: Build frontend
        run: npm run build
